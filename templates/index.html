<!doctype html>
<html lang="en">
<head xmlns="http://www.w3.org/1999/xhtml">
    <title>Car Price Predictor</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
            integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk"
          crossorigin="anonymous">

</head>

<body>

<div class="main-container">

    <div class="glass-card">

        <div class="header-section">
            <h1>🚗 Car Price Predictor</h1>
            <p>Predict your vehicle's market value by selecting given options</p>
        </div>

        <form method="post"
              action="/predict"
              accept-charset="utf-8"
              name="Modelform">

            <div class="form-grid">

                <!-- LEFT COLUMN -->
                <div class="section-card">

                    <h3>🚘 <u>Car Details</u></h3>

                    <div class="form-group">
                        <label>Car Name</label>
                        <select class="form-control"
                                name="CarName"
                                required>
                                <option value="Select Car Name" selected>
                                  Select Car Name
                                </option>

                                {% for car in CarName[1:] %}
                                <option value="{{ car }}">{{ car }}</option>
                                {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fuel Type</label>
                        <select class="form-control"
                                name="fueltype"
                                required>

                            {% for fuel in fueltype %}
                            <option value="{{ fuel }}">{{ fuel }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Aspiration</label>
                        <select class="form-control"
                                name="aspiration"
                                required>

                            {% for item in aspiration %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Door Number</label>
                        <select class="form-control"
                                name="doornumber"
                                required>

                            {% for item in doornumber %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Car Body</label>
                        <select class="form-control"
                                name="carbody"
                                required>

                            {% for item in carbody %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Drive Wheel</label>
                        <select class="form-control"
                                name="drivewheel"
                                required>

                            {% for item in drivewheel %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Engine Location</label>
                        <select class="form-control"
                                name="enginelocation"
                                required>

                            {% for item in enginelocation %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Engine Type</label>
                        <select class="form-control"
                                name="enginetype"
                                required>

                            {% for item in enginetype %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cylinder Number</label>
                        <select class="form-control"
                                name="cylindernumber"
                                required>

                            {% for item in cylindernumber %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fuel System</label>
                        <select class="form-control"
                                name="fuelsystem"
                                required>

                            {% for item in fuelsystem %}
                            <option value="{{ item }}">{{ item }}</option>
                            {% endfor %}

                        </select>
                    </div>

                </div>

            </div>

            <button type="button"
                    class="predict-btn"
                    onclick="send_data()">
                Predict Price
            </button>

        </form>

        <div class="prediction-card">
            <h2 id="prediction">
                Prediction will appear here
            </h2>
        </div>

    </div>

</div>

<script>

function form_handler(event){
    event.preventDefault();
}

function send_data(){

    document.querySelector('form')
            .addEventListener('submit', form_handler);

    var fd = new FormData(
        document.querySelector('form')
    );

    var xhr = new XMLHttpRequest();

    xhr.open('POST','/predict',true);

    document.getElementById("prediction").innerHTML =
        "⏳ Predicting Price...";

    xhr.onreadystatechange = function(){

        if(xhr.readyState == XMLHttpRequest.DONE){

            if(xhr.responseText === "Cannot predict the price" ||
               xhr.responseText === "Please select a valid car")
            {
                document.getElementById("prediction").innerHTML =
                    "❌ " + xhr.responseText;
            }
            else
            {
                document.getElementById("prediction").innerHTML =
                    "💰 Estimated Price: ₹ " +
                    Number(xhr.responseText).toLocaleString('en-IN');
            }
        }
    };

    xhr.send(fd);
}

</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>

</body>
</html>
